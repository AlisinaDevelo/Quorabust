name: Observability smoke

on:
  workflow_dispatch:

jobs:
  tracing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade "pip>=26" && pip install -e ".[dev,observability]"
      - name: OpenTelemetry integration test
        run: pytest -q tests/test_tracing_optional.py --tb=short
