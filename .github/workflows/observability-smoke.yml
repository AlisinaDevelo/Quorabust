name: Observability smoke

on:
  workflow_dispatch:

jobs:
  tracing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade "pip>=26" && pip install -e ".[dev,observability]"
      - name: OpenTelemetry integration test
        run: pytest -q tests/test_tracing_optional.py --tb=short
