name: NLP smoke

on:
  workflow_dispatch:

jobs:
  embedding-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade "pip>=26" && pip install -e ".[dev,nlp]"
      - name: Pytest embedding module
        run: pytest -q tests/test_embedding_features.py --tb=short
