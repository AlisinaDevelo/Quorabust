name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade "pip>=26" && pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/quorabust
      - name: Pytest
        run: pytest -q --cov=quorabust --cov-report=term-missing --cov-fail-under=70
      - name: CLI
        run: quorabust-train --help
      - name: Data audit CLI
        run: quorabust-audit-data --help
      - name: Benchmark protocol CLI
        run: quorabust-validate-protocol --help
      - name: Benchmark protocol builder CLI
        run: quorabust-build-protocol --help
      - name: Benchmark protocol builder template
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          template = json.loads(
              Path("examples/protocol-builder.config.example.json").read_text()
          )
          assert template["split"]["question_id_columns"] == ["qid1", "qid2"]
          assert "sha256" not in json.dumps(template)
          assert template["dataset"]["license"].startswith("REPLACE_WITH_")
          PY
      - name: Strict data audit smoke
        run: |
          python - <<'PY'
          import pandas as pd

          pd.DataFrame(
              {
                  "question1": ["a", "b"],
                  "question2": ["c", "d"],
                  "is_duplicate": [0, 1],
                  "qid1": ["q1", "q3"],
                  "qid2": ["q2", "q4"],
              }
          ).to_csv("/tmp/quorabust-strict-audit.csv", index=False)
          PY
          quorabust-audit-data \
            --csv /tmp/quorabust-strict-audit.csv \
            --out /tmp/quorabust-strict-audit.json \
            --require-question-ids
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/quorabust-strict-audit.json").read_text())
          assert payload["status"] == "pass"
          assert payload["question_ids"]["present"] is True
          PY
          if quorabust-audit-data \
            --csv examples/smoke_pairs.csv \
            --out /tmp/quorabust-strict-audit-failure.json \
            --require-question-ids; then
            echo "strict audit unexpectedly accepted a dataset without question IDs"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/quorabust-strict-audit-failure.json").read_text())
          question_id_check = next(
              check for check in payload["checks"] if check["name"] == "question_ids"
          )
          assert payload["status"] == "fail"
          assert question_id_check["status"] == "fail"
          PY
      - name: Benchmark role freezer smoke
        run: |
          export FREEZE_DIR="$(mktemp -d)"
          python - <<'PY'
          import os
          from pathlib import Path

          import pandas as pd

          root = Path(os.environ["FREEZE_DIR"])
          components = 12
          rows = components * 2
          pd.DataFrame(
              {
                  "question1": [f"question one {index}" for index in range(rows)],
                  "question2": [f"question two {index // 2}" for index in range(rows)],
                  "is_duplicate": [index % 2 for index in range(rows)],
                  "qid1": [f"q{index // 2 * 3}" for index in range(rows)],
                  "qid2": [f"q{index // 2 * 3 + index % 2 + 1}" for index in range(rows)],
              }
          ).to_csv(root / "source.csv", index=False)
          PY
          quorabust-freeze-protocol \
            --csv "$FREEZE_DIR/source.csv" \
            --out-dir "$FREEZE_DIR/roles" \
            --audit-out "$FREEZE_DIR/audit.json" \
            --split-out "$FREEZE_DIR/split.json" \
            --seed 42
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import pandas as pd

          root = Path(os.environ["FREEZE_DIR"])
          manifest = json.loads((root / "split.json").read_text())
          assert manifest["roles_are_disjoint"] is True
          assert json.loads((root / "audit.json").read_text())["status"] == "pass"
          question_ids = []
          for role, record in manifest["roles"].items():
              path = root / "roles" / f"{role}.csv"
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == record["sha256"]
              assert record["label_counts"] == {
                  "0": record["rows"] // 2,
                  "1": record["rows"] // 2,
              }
              frame = pd.read_csv(path, dtype={"qid1": "string", "qid2": "string"})
              question_ids.append(set(frame["qid1"]) | set(frame["qid2"]))
          for index, current in enumerate(question_ids):
              for other in question_ids[index + 1 :]:
                  assert current.isdisjoint(other)
          PY
      - name: Benchmark protocol smoke
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path.cwd()
          source = Path("/tmp/quorabust-protocol-source.csv")
          with source.open("w", newline="") as handle:
              writer = csv.writer(handle)
              writer.writerow(["question1", "question2", "is_duplicate", "qid1", "qid2"])
              writer.writerow(["a", "a", 1, "q1", "q1"])
              writer.writerow(["b", "c", 0, "q2", "q3"])

          roles = {}
          for role in ("train", "tuning", "calibration", "final_holdout"):
              role_path = Path(f"/tmp/quorabust-protocol-{role}.json")
              role_path.write_text(json.dumps({"role": role}) + "\n")
              roles[role] = {
                  "purpose": f"synthetic {role} artifact",
                  "path": str(role_path),
                  "reference": f"synthetic://{role}.json",
              }

          split_path = Path("/tmp/quorabust-protocol-split.json")
          split_path.write_text('{"strategy": "question_component_holdout"}\n')
          config = {
              "protocol_name": "quorabust-synthetic-ci-v1",
              "dataset": {
                  "name": "synthetic CI fixture",
                  "source_path": str(source),
                  "source_reference": "synthetic://source.csv",
                  "license": "synthetic CI fixture",
                  "terms": "no external benchmark claim",
                  "audit_path": "/tmp/quorabust-protocol-audit.json",
                  "audit_reference": "synthetic://audit.json",
              },
              "roles": roles,
              "split": {
                  "manifest_path": str(split_path),
                  "manifest_reference": "synthetic://split.json",
                  "seed": 42,
                  "eval_fraction": 0.1,
                  "question_id_columns": ["qid1", "qid2"],
              },
              "decision_policy": {
                  "threshold_metric": "f1",
                  "threshold_candidates": [0.2, 0.5, 0.8],
                  "calibration_method": "sigmoid",
              },
              "dependency_lock_path": str(root / "requirements.txt"),
              "dependency_lock_reference": "repo://requirements.txt",
              "repository_path": str(root),
              "command": "synthetic CI protocol builder smoke",
          }
          Path("/tmp/quorabust-protocol-config.json").write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n"
          )
          PY
          quorabust-audit-data \
            --csv /tmp/quorabust-protocol-source.csv \
            --out /tmp/quorabust-protocol-audit.json \
            --require-question-ids
          quorabust-build-protocol \
            --config /tmp/quorabust-protocol-config.json \
            --out /tmp/quorabust-protocol.json
          quorabust-validate-protocol --protocol /tmp/quorabust-protocol.json
      - name: Serve CLI
        run: quorabust-serve --help
      - name: Report CLI
        run: quorabust-report --help
      - name: Report validator CLI
        run: quorabust-validate-report --help
      - name: Protocol-bound report validator smoke
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from tests.test_report_validation import _payload, _protocol_payload

          Path("/tmp/quorabust-protocol-report.json").write_text(
              json.dumps(_payload(), sort_keys=True) + "\n"
          )
          Path("/tmp/quorabust-protocol-report-protocol.json").write_text(
              json.dumps(_protocol_payload(), sort_keys=True) + "\n"
          )
          PY
          quorabust-validate-report \
            --report /tmp/quorabust-protocol-report.json \
            --protocol /tmp/quorabust-protocol-report-protocol.json
      - name: Calibration CLI
        run: quorabust-calibrate --help
      - name: Retrieval CLI
        run: quorabust-retrieve --help
      - name: Retrieval benchmark CLI
        run: quorabust-retrieve-benchmark --help
      - name: Retrieval profile CLI
        run: quorabust-retrieve-profile --help
      - name: Retrieval validator CLI
        run: quorabust-validate-retrieval --help
      - name: Hard-negative mining CLI
        run: quorabust-mine-hard-negatives --help
      - name: Safe artifact CLI
        run: quorabust-export-safe --help
      - name: Tracing helper
        run: python -c "from quorabust.tracing import tracing_available; assert isinstance(tracing_available(), bool)"
      - name: Demo assets CLI
        run: |
          quorabust-demo-assets --out /tmp/quorabust-demo-assets
          quorabust-demo-assets --out docs/demo-assets --check
      - name: Smoke model report
        run: |
          quorabust-audit-data \
            --csv examples/smoke_pairs.csv \
            --out /tmp/quorabust-smoke-data-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("/tmp/quorabust-smoke-data-audit.json").read_text())
          assert audit["status"] == "pass"
          assert audit["labels"]["invalid_count"] == 0
          PY
          quorabust-train \
            --csv examples/smoke_pairs.csv \
            --out /tmp/quorabust-smoke.pkl \
            --metadata-out /tmp/quorabust-smoke.meta.json \
            --eval-fraction 0 \
            --seed 7
          quorabust-report \
            --model /tmp/quorabust-smoke.pkl \
            --artifact-label quorabust-smoke.pkl \
            --eval-csv examples/smoke_pairs.csv \
            --out /tmp/quorabust-smoke-model-card.md
          quorabust-report \
            --model /tmp/quorabust-smoke.pkl \
            --artifact-label quorabust-smoke.pkl \
            --eval-csv examples/smoke_pairs.csv \
            --format json \
            --out /tmp/quorabust-smoke-model-card.json \
            --manifest-out /tmp/quorabust-smoke-model-card.manifest.json
          quorabust-validate-report \
            --report /tmp/quorabust-smoke-model-card.json \
            --require-holdout \
            --require-calibration \
            --require-manifest
          test -s /tmp/quorabust-smoke-model-card.md
          test -s /tmp/quorabust-smoke-model-card.json
          test -s /tmp/quorabust-smoke-model-card.manifest.json
          test -s /tmp/quorabust-smoke.meta.json
          test -s /tmp/quorabust-smoke-data-audit.json
      - name: Pinned serving smoke
        run: |
          export QUORABUST_MODEL_PATH=/tmp/quorabust-smoke.pkl
          export QUORABUST_MODEL_SHA256="$(python -c 'from pathlib import Path; from quorabust.lineage import sha256_file; print(sha256_file(Path("/tmp/quorabust-smoke.pkl")))')"
          python - <<'PY'
          from starlette.testclient import TestClient

          from quorabust.serve import create_app

          with TestClient(create_app(max_text_length=4)) as client:
              assert client.get("/ready").status_code == 200
              response = client.post(
                  "/predict",
                  json={"question1": ["hello"], "question2": ["world"]},
              )
              assert response.status_code == 413
              assert response.json()["error"]["code"] == "batch_too_large"
          PY
      - name: Safe artifact smoke
        run: |
          quorabust-export-safe \
            --model /tmp/quorabust-smoke.pkl \
            --out /tmp/quorabust-smoke.qmodel \
            --metadata-out /tmp/quorabust-smoke.qmodel.meta.json
          python - <<'PY'
          from pathlib import Path
          from quorabust.persist import load_classifier

          model = Path("/tmp/quorabust-smoke.qmodel")
          builder, classifier, meta = load_classifier(model)
          assert builder._fitted is True
          assert classifier.get_booster() is not None
          assert meta["artifact_format"] == "quorabust.safe.tfidf_xgboost"
          PY
      - name: Retrieval benchmark smoke
        run: |
          quorabust-retrieve-benchmark \
            --catalog-csv examples/retrieval_catalog.csv \
            --qrels-csv examples/retrieval_qrels.csv \
            --ks 1,2 \
            --candidate-k 2 \
            --warmup-runs 1 \
            --repetitions 2 \
            --timeout-seconds 10 \
            --out /tmp/quorabust-retrieval-benchmark.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/quorabust-retrieval-benchmark.json").read_text())
          assert report["schema_version"] == 1
          assert report["benchmark"] == "quorabust-retrieve-benchmark"
          assert report["first_stage"]["recall_at_k"]["1"] == 1.0
          assert report["sources"]["catalog"]["sha256"]
          assert report["measurement_policy"]["warmup_runs"] == 1
          assert report["measurement_policy"]["repetitions"] == 2
          assert report["latency_ms"]["end_to_end"]["count"] == 8
          assert set(report["query_length_strata"]) == {"short", "medium"}
          assert report["query_length_strata"]["short"]["measured_query_count"] == 2
          assert report["query_length_strata"]["medium"]["measured_query_count"] == 6
          assert report["runtime"]["retriever_initialization_ms"] >= 0
          assert report["runtime"]["startup_measurement"] == "retriever_and_reranker_initialization_only"
          PY
          quorabust-validate-retrieval \
            --report /tmp/quorabust-retrieval-benchmark.json \
            --min-final-recall-at-k 1=1.0 \
            --max-end-to-end-p95-ms 1000
      - name: Retrieval process profile smoke
        run: |
          quorabust-retrieve-profile \
            --catalog-csv examples/retrieval_catalog.csv \
            --qrels-csv examples/retrieval_qrels.csv \
            --ks 1,2 \
            --candidate-k 2 \
            --warmup-runs 0 \
            --repetitions 1 \
            --cold-start-repetitions 2 \
            --timeout-seconds 10 \
            --artifact /tmp/quorabust-smoke.qmodel \
            --out /tmp/quorabust-retrieval-profile.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/quorabust-retrieval-profile.json").read_text())
          assert report["schema_version"] == 1
          assert report["benchmark"] == "quorabust-retrieve-profile"
          assert report["evidence_scope"] == "timing_and_size_only_no_quality_claim"
          assert report["cold_start"]["measurement_count"] == 2
          assert report["sources"]["catalog"]["bytes"] > 0
          assert report["artifacts"][0]["bytes"] > 0
          assert report["warm_benchmark"]["query_count"] == 4
          assert set(report["warm_benchmark"]["query_length_strata"]) == {"short", "medium"}
          PY
          quorabust-validate-retrieval \
            --report /tmp/quorabust-retrieval-profile.json \
            --max-end-to-end-p95-ms 1000 \
            --max-cold-start-p95-ms 20000 \
            --max-peak-rss-bytes 8589934592 \
            --max-total-artifact-bytes 10485760
